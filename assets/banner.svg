<svg width="1000" height="235" viewBox="0 0 1000 235" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Space & Mesh Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="35%" stop-color="#071228"/>
      <stop offset="70%" stop-color="#0b1b3b"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Glowing Top Neon Accent Bar (Burp Orange + Cyber Cyan + Gold) -->
    <linearGradient id="neon-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6633"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Name Metallic & Cyber Glow Gradient -->
    <linearGradient id="name-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="cyber-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.35"/>
    </pattern>

    <!-- Filter for Subtle Glow Drop Shadow -->
    <filter id="cyber-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Card Frame -->
  <rect x="2" y="2" width="996" height="231" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="1.6"/>
  <rect x="2" y="2" width="996" height="231" rx="16" fill="url(#cyber-grid)"/>
  <rect x="6" y="6" width="988" height="223" rx="12" fill="none" stroke="#f59e0b" stroke-width="0.75" stroke-opacity="0.25"/>

  <!-- Top Accent Laser -->
  <path d="M 18 6 L 982 6" stroke="url(#neon-bar)" stroke-width="3.2" stroke-linecap="round"/>

  <!-- Circuit Trace Accents -->
  <g opacity="0.4" stroke="#f59e0b" stroke-width="1.2" fill="none">
    <path d="M 24 50 L 70 50 L 90 70 L 130 70"/>
    <circle cx="24" cy="50" r="3" fill="#ff6633"/>
    <circle cx="130" cy="70" r="2.5" fill="#38bdf8"/>

    <path d="M 976 50 L 930 50 L 910 70 L 870 70"/>
    <circle cx="976" cy="50" r="3" fill="#34d399"/>
    <circle cx="870" cy="70" r="2.5" fill="#f59e0b"/>
  </g>

  <!-- Top Terminal Bar -->
  <g transform="translate(32, 22)">
    <circle cx="6" cy="8" r="4.5" fill="#ef4444" opacity="0.9"/>
    <circle cx="20" cy="8" r="4.5" fill="#f59e0b" opacity="0.9"/>
    <circle cx="34" cy="8" r="4.5" fill="#10b981" opacity="0.9"/>
    
    <text x="50" y="12" fill="#94a3b8" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" font-weight="600" letter-spacing="0.5">
      <tspan fill="#ff6633">burp@montoya-runtime</tspan>:<tspan fill="#cbd5e1">~#</tspan> java -jar authentix-enterprise-v3.0.0.jar --daemon
    </text>

    <!-- Right-Hand Status Indicator -->
    <g transform="translate(685, -3)">
      <rect x="0" y="0" width="250" height="24" rx="12" fill="#030712" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.5"/>
      <circle cx="14" cy="12" r="4" fill="#38bdf8">
        <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="26" y="15.5" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" letter-spacing="0.8">MONTOYA 2026.7 // 14,880 REQ/S</text>
    </g>
  </g>

  <!-- Center Identity Area -->
  <text x="500" y="96" fill="url(#name-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'JetBrains Mono', Roboto, sans-serif" font-size="42" font-weight="900" letter-spacing="4" text-anchor="middle" filter="url(#cyber-glow)">
    AUTHENTIX ENTERPRISE
  </text>

  <!-- Primary Subtitle -->
  <text x="500" y="126" fill="#fcd34d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" letter-spacing="1.4" text-anchor="middle">
    AUTONOMOUS BOLA/IDOR &amp; MULTI-TENANT AUTHORIZATION ENGINE FOR BURP SUITE
  </text>

  <!-- Secondary Capability Line -->
  <text x="500" y="148" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="500" letter-spacing="0.5" text-anchor="middle">
    34 Deterministic Invariants • Soft-200 Error Disambiguation • 16 Compound ATO Attack Chains
  </text>

  <!-- Bottom Row: 3 Distinct Pillars -->
  <g transform="translate(42, 172)">
    <!-- Pillar 1: 3-Way Differential IDOR -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="288" height="34" rx="8" fill="#091830" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7"/>
      <text x="144" y="21.5" fill="#7dd3fc" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.4">
        🎯 3-Way Differential IDOR Engine
      </text>
    </g>

    <!-- Pillar 2: 34 Invariants -->
    <g transform="translate(314, 0)">
      <rect x="0" y="0" width="288" height="34" rx="8" fill="#1c1404" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.7"/>
      <text x="144" y="21.5" fill="#fcd34d" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.4">
        🛡️ 34 Mathematical Invariants
      </text>
    </g>

    <!-- Pillar 3: PortSwigger Montoya -->
    <g transform="translate(628, 0)">
      <rect x="0" y="0" width="288" height="34" rx="8" fill="#1f0e04" stroke="#ff6633" stroke-width="1.2" stroke-opacity="0.7"/>
      <text x="144" y="21.5" fill="#fdba74" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.4">
        ⚡ PortSwigger Montoya API (Java)
      </text>
    </g>
  </g>
</svg>
